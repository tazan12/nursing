<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ECG Rhythm Lab</title>
  <style>
    :root{--bg:#050b14;--panel:#102033;--line:#263c55;--text:#f5f8ff;--muted:#9fb0c4;--mint:#4be0cf;--red:#ff748d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16304c,#050b14 45%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:22px 0 40px}.top,.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-size:1.35rem;font-weight:900}.brand small{display:block;color:var(--muted);font-size:.68rem;margin-top:4px}.card{background:linear-gradient(145deg,rgba(18,36,58,.96),rgba(8,18,31,.96));border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px rgba(0,0,0,.25)}.hero{margin-top:18px;padding:30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:8px 0}.hero em{font-style:normal;color:var(--mint)}.hero p{color:var(--muted);line-height:1.7}.score{min-width:120px;text-align:center;padding:20px;border-radius:18px;background:#081524}.score strong{display:block;font-size:2rem;color:var(--mint)}.controls{margin-top:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,button{font:inherit;border-radius:12px;padding:12px}select{background:#081524;color:var(--text);border:1px solid var(--line)}button{border:0;background:var(--mint);font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:14px;margin-top:14px}.monitor,.quiz,.explain{padding:18px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(75,224,207,.1);color:var(--mint);font-size:.72rem;font-weight:800}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.75rem;margin-top:10px}.hr{color:var(--mint);font-size:2rem;font-weight:900}.screen{position:relative;margin-top:14px;height:280px;background:#04120f;border-radius:15px;overflow:hidden;border:1px solid rgba(75,224,207,.18)}canvas{display:block;width:100%;height:100%}.sweep{position:absolute;top:0;bottom:0;width:56px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(104,243,216,.08),rgba(104,243,216,.24));transform:translateX(-100%)}.question{font-size:1.25rem;line-height:1.45}.opts{display:grid;gap:9px}.opt{background:#081524;color:var(--text);border:1px solid var(--line);text-align:left}.opt.correct{border-color:var(--mint);background:rgba(75,224,207,.1)}.opt.wrong{border-color:var(--red);background:rgba(255,116,141,.1)}.feedback{margin-top:12px;color:var(--muted)}.explain{margin-top:14px;display:none}.explain.show{display:block}.explain p{color:var(--muted);line-height:1.7}.foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:20px}@media(max-width:760px){.hero{display:grid}.score{width:100%}.controls,.grid{grid-template-columns:1fr}.screen{height:210px}.head{align-items:flex-start}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">ECG Rhythm Lab<small>임상 심전도 학습 스튜디오</small></div><div class="tag">파형 엔진 v3 · LIVE</div></div>
  <section class="hero card"><div><span class="tag">NURSING · ECG</span><h1>파형을 읽고,<br><em>임상 판단</em>까지</h1><p>정상 리듬부터 심방세동, 심실빈맥, 완전 방실차단까지 실제 모니터처럼 움직이는 파형으로 학습합니다.</p></div><div class="score"><strong id="pct">0%</strong><span>정답률</span></div></section>
  <section class="controls card"><select id="cat"><option>전체</option></select><select id="level"><option value="all">전체 난이도</option><option value="basic">기초</option><option value="advanced">심화</option></select><button id="next">다음 문제</button></section>
  <section class="grid"><article class="monitor card"><div class="head"><div><span id="tag" class="tag">리듬</span><h2 id="title">문제 준비 중</h2><div class="meta"><span id="regularity"></span><span>Lead II</span><span>25 mm/s</span></div></div><div><span class="hr" id="hr">--</span> bpm</div></div><div class="screen"><canvas id="ecg" aria-label="움직이는 심전도 파형"></canvas><div id="sweep" class="sweep"></div></div></article><aside class="quiz card"><div class="tag">QUESTION</div><h2 id="q" class="question"></h2><div id="opts" class="opts"></div><div id="fb" class="feedback"></div></aside></section>
  <section id="exp" class="explain card"><h2>판독 근거와 우선 간호</h2><p id="desc"></p><p><b>핵심 소견:</b> <span id="finding"></span></p><p><b>우선 간호:</b> <span id="action"></span></p></section>
  <div class="foot">교육용 합성 파형입니다. 실제 진단이나 환자 처치에 사용하지 마세요.</div>
</main>
<script>
const data=[
 {c:'정상·동성리듬',l:'basic',t:'정상 동성리듬',h:72,r:'규칙적',q:'이 파형의 가장 적절한 판독은?',o:['정상 동성리듬','심방세동','심실빈맥','완전 방실차단'],a:0,d:'규칙적인 R-R 간격과 각 QRS 앞의 P파를 확인합니다.',f:'P-QRS 1:1, 규칙적 R-R',n:'증상과 활력징후를 확인하고 관찰합니다.',w:'sinus'},
 {c:'허혈·ST-T 변화',l:'advanced',t:'안정형 협심증 의심',h:88,r:'규칙적',q:'흉통 환자에서 우선 주목할 변화는?',o:['ST 분절 하강','긴 휴지기','톱니모양 F파','방실 해리'],a:0,d:'허혈 시 수평 또는 하향형 ST 하강이 나타날 수 있습니다.',f:'일관된 ST 분절 하강',n:'흉통·활력징후를 사정하고 12유도 ECG 후 즉시 보고합니다.',w:'down'},
 {c:'급성 심근경색',l:'advanced',t:'급성 ST 상승 심근경색 의심',h:96,r:'규칙적',q:'연속 유도의 ST 상승은 무엇을 시사합니까?',o:['급성 심근손상 가능성','정상 변이','심방조동','1도 방실차단'],a:0,d:'증상과 함께 나타난 연속 유도의 ST 상승은 급성 심근경색을 의심하게 합니다.',f:'연속 유도의 ST 상승',n:'응급 대응체계를 활성화하고 재관류 치료를 준비합니다.',w:'up'},
 {c:'심방성 부정맥',l:'basic',t:'심방세동',h:132,r:'완전 불규칙',q:'불규칙한 R-R 간격과 뚜렷한 P파 부재가 보이는 리듬은?',o:['심방세동','동성빈맥','심실세동','Mobitz I'],a:0,d:'심방세동은 조직화된 P파가 없고 심실 반응이 완전히 불규칙합니다.',f:'P파 부재, 미세한 fibrillatory baseline, 불규칙한 R-R',n:'혈역학적 안정성과 맥박 결손을 확인합니다.',w:'af'},
 {c:'심방성 부정맥',l:'advanced',t:'심방조동 (4:1 전도)',h:75,r:'심방 규칙적 · 심실 규칙적',q:'반복적인 톱니모양 F파와 고정 전도비가 보이는 리듬은?',o:['심방조동','심실세동','정상 동성리듬','동성정지'],a:0,d:'약 300회의 규칙적인 F파 중 네 번째마다 QRS가 발생하는 4:1 전도를 표현합니다.',f:'톱니모양 F파, 고정 4:1 전도',n:'심실 반응과 혈역학적 안정성을 확인합니다.',w:'flutter'},
 {c:'심실성 부정맥',l:'advanced',t:'단형 심실빈맥',h:182,r:'규칙적',q:'저혈압을 동반한 넓은 QRS 빈맥에서 우선 확인할 것은?',o:['맥박과 혈역학적 안정성','P파만 확인','정상 리듬 기록','보행 권장'],a:0,d:'심실빈맥은 넓고 규칙적이며 같은 모양의 QRS가 빠르게 반복됩니다.',f:'규칙적인 넓은 단형 QRS 빈맥',n:'맥박 확인, 응급 호출, 동기화 심율동전환을 준비합니다.',w:'vt'},
 {c:'심실성 부정맥',l:'advanced',t:'심실세동',h:0,r:'무질서',q:'맥박이 없고 조직화된 QRS가 없는 경우 우선 처치는?',o:['즉시 CPR과 제세동','보행 격려','24시간 뒤 재평가','경구 수분'],a:0,d:'심실세동은 유효한 심박출이 없는 치명적 리듬입니다.',f:'진폭과 주기가 불규칙한 무질서 파형, QRS 없음',n:'즉시 CPR을 시작하고 제세동을 시행합니다.',w:'vf'},
 {c:'전도장애',l:'advanced',t:'완전 방실차단',h:38,r:'P-P와 R-R 각각 규칙적',q:'P파와 QRS가 서로 독립적으로 진행하는 소견은?',o:['3도 방실차단','정상 동성리듬','심방세동','PVC'],a:0,d:'심방과 심실이 독립적으로 탈분극하며 느린 심실 이탈리듬이 나타납니다.',f:'규칙적 P파와 느린 QRS 사이의 방실해리',n:'저관류 증상을 확인하고 경피적 심박동조율을 준비합니다.',w:'block'}
];
const $=s=>document.querySelector(s), canvas=$('#ecg'), ctx=canvas.getContext('2d');
let cur=null, start=performance.now(), raf=0, stats=JSON.parse(localStorage.getItem('ecg-docs-v3')||'{"c":0,"t":0}');
const afPattern=[.18,.70,1.16,1.84,2.29,2.92,3.40,4.12,4.59,5.18,5.90,6.35,7.09,7.60];
[...new Set(data.map(x=>x.c))].forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`));
function gauss(x,m,s){const z=(x-m)/s;return Math.exp(-.5*z*z)}
function beatShape(p,kind='normal',st=0){
 if(kind==='wide')return -0.32*gauss(p,.11,.025)+1.12*gauss(p,.20,.055)-.74*gauss(p,.34,.065)+.22*gauss(p,.58,.10);
 return .13*gauss(p,.11,.035)-.12*gauss(p,.265,.012)+1.05*gauss(p,.30,.014)-.32*gauss(p,.335,.018)+(st?st*(gauss(p,.43,.09)+gauss(p,.56,.12)):0)+.27*gauss(p,.62,.075);
}
function deterministicNoise(x){return Math.sin(x*12.9898+78.233)*.55+Math.sin(x*31.17+4.2)*.3+Math.sin(x*73.3)*.15}
function sample(type,t){
 if(type==='vf'){const mod=.72+.26*Math.sin(t*1.13)+.12*Math.sin(t*.37);return mod*(.34*Math.sin(t*18.7)+.24*Math.sin(t*25.1+1.4)+.15*Math.sin(t*37.9+.2))+.08*deterministicNoise(t)}
 if(type==='flutter'){const atrial=(t*5)%1;const saw=.13*(1-2*atrial);const cycle=t%0.8;return saw+beatShape(cycle/.8)}
 if(type==='vt'){const cycle=t%(60/182);return beatShape(cycle/(60/182),'wide')}
 if(type==='block'){let y=0;const pp=t%0.72;y+=.13*gauss(pp,.10,.035);const rr=t%1.58;y+=beatShape(rr/1.58,'wide')*.78;return y}
 if(type==='af'){
   let y=.026*Math.sin(t*37)+.02*Math.sin(t*53.3+1.1)+.012*deterministicNoise(t);
   const phase=((t%8)+8)%8;for(const b of afPattern){for(const offset of [-8,0]){const p=(phase-(b+offset))/.68;if(p>=0&&p<1)y+=beatShape(p)*.92}}return y;
 }
 const rate=cur?.h||72,cycle=t%(60/rate),p=cycle/(60/rate),st=type==='down'?-.22:type==='up'?.25:0;return beatShape(p,'normal',st);
}
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function grid(w,h){ctx.fillStyle='#04120f';ctx.fillRect(0,0,w,h);for(let x=0;x<=w;x+=10){ctx.strokeStyle=x%50===0?'#155b50':'#0d342f';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<=h;y+=10){ctx.strokeStyle=y%50===0?'#155b50':'#0d342f';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
function draw(now){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;if(!w||!h){raf=requestAnimationFrame(draw);return}grid(w,h);const elapsed=(now-start)/1000,windowSec=window.innerWidth<600?5.2:7.5,base=h*.52,amp=Math.min(h*.32,72);ctx.beginPath();for(let x=0;x<=w;x+=1.5){const t=elapsed-windowSec+(x/w)*windowSec,y=base-sample(cur?.w||'sinus',t)*amp;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='#68f3d8';ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor='rgba(104,243,216,.65)';ctx.shadowBlur=5;ctx.stroke();ctx.shadowBlur=0;$('#sweep').style.transform=`translateX(${((elapsed*115)%(w+70))-70}px)`;raf=requestAnimationFrame(draw)}
function pct(){$('#pct').textContent=stats.t?Math.round(stats.c/stats.t*100)+'%':'0%'}
function next(){const pool=data.filter(x=>($('#cat').value==='전체'||x.c===$('#cat').value)&&($('#level').value==='all'||x.l===$('#level').value));cur=pool[Math.floor(Math.random()*pool.length)];start=performance.now();$('#tag').textContent=cur.c;$('#title').textContent=cur.t;$('#hr').textContent=cur.h||'—';$('#regularity').textContent='리듬 '+cur.r;$('#q').textContent=cur.q;$('#fb').textContent='';$('#exp').classList.remove('show');$('#opts').innerHTML='';cur.o.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>ans(i,b);$('#opts').appendChild(b)})}
function ans(i,b){document.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n===cur.a)x.classList.add('correct')});if(i!==cur.a)b.classList.add('wrong');stats.t++;if(i===cur.a)stats.c++;localStorage.setItem('ecg-docs-v3',JSON.stringify(stats));pct();$('#fb').textContent=i===cur.a?'정답입니다.':'오답입니다. 정답과 근거를 확인하세요.';$('#desc').textContent=cur.d;$('#finding').textContent=cur.f;$('#action').textContent=cur.n;$('#exp').classList.add('show')}
$('#next').onclick=next;$('#cat').onchange=next;$('#level').onchange=next;addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(!document.hidden)start=performance.now()});resize();pct();next();raf=requestAnimationFrame(draw);
</script>
</body>
</html>
