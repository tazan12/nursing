<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>ECG Rhythm Lab</title><style>:root{--bg:#050b14;--panel:#102033;--line:#263c55;--text:#f5f8ff;--muted:#9fb0c4;--mint:#4be0cf;--red:#ff748d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16304c,#050b14 45%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:22px 0 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.35rem;font-weight:900}.brand small{display:block;color:var(--muted);font-size:.68rem;margin-top:4px}.card{background:linear-gradient(145deg,rgba(18,36,58,.96),rgba(8,18,31,.96));border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px rgba(0,0,0,.25)}.hero{margin-top:18px;padding:30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:8px 0}.hero em{font-style:normal;color:var(--mint)}.hero p{color:var(--muted);line-height:1.7}.score{min-width:120px;text-align:center;padding:20px;border-radius:18px;background:#081524}.score strong{font-size:2rem;color:var(--mint)}.controls{margin-top:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,button{font:inherit;border-radius:12px;padding:12px}select{background:#081524;color:var(--text);border:1px solid var(--line)}button{border:0;background:var(--mint);font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:14px;margin-top:14px}.monitor,.quiz,.explain{padding:18px}.head{display:flex;justify-content:space-between;align-items:start}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(75,224,207,.1);color:var(--mint);font-size:.72rem;font-weight:800}.hr{color:var(--mint);font-size:2rem;font-weight:900}.screen{margin-top:14px;background:#04120f;border-radius:15px;overflow:hidden;border:1px solid rgba(75,224,207,.18)}svg{display:block;width:100%;min-height:220px}.small{stroke:#0d342f}.large{stroke:#155b50}.wave{fill:none;stroke:#68f3d8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.question{font-size:1.25rem;line-height:1.45}.opts{display:grid;gap:9px}.opt{background:#081524;color:var(--text);border:1px solid var(--line);text-align:left}.opt.correct{border-color:var(--mint);background:rgba(75,224,207,.1)}.opt.wrong{border-color:var(--red);background:rgba(255,116,141,.1)}.feedback{margin-top:12px;color:var(--muted)}.explain{margin-top:14px;display:none}.explain.show{display:block}.explain p{color:var(--muted);line-height:1.7}.foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:20px}@media(max-width:760px){.hero{display:grid}.score{width:100%}.controls,.grid{grid-template-columns:1fr}svg{min-height:170px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">ECG Rhythm Lab<small>PTB-XL Learning Studio</small></div><div id="status" class="tag">준비 완료</div></div><section class="hero card"><div><span class="tag">NURSING · ECG</span><h1>파형을 읽고,<br><em>임상 판단</em>까지</h1><p>협심증의 ST 변화부터 심방세동, 심실빈맥, 완전 방실차단까지 PC와 휴대폰에서 학습합니다.</p></div><div class="score"><strong id="pct">0%</strong><div>정답률</div></div></section><section class="controls card"><select id="cat"><option>전체</option></select><select id="level"><option value="all">전체 난이도</option><option value="basic">기초</option><option value="advanced">심화</option></select><button id="next">새 문제</button></section><section class="grid"><article class="monitor card"><div class="head"><div><span id="tag" class="tag">리듬</span><h2 id="title">문제 준비 중</h2></div><div><span class="hr" id="hr">--</span> bpm</div></div><div class="screen"><svg viewBox="0 0 1000 320"><defs><pattern id="s" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" class="small" fill="none"/></pattern><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#s)"/><path d="M50 0H0V50" class="large" fill="none"/></pattern></defs><rect width="1000" height="320" fill="url(#g)"/><path id="wave" class="wave"/></svg></div></article><aside class="quiz card"><div class="tag">QUESTION</div><h2 id="q" class="question"></h2><div id="opts" class="opts"></div><div id="fb" class="feedback"></div></aside></section><section id="exp" class="explain card"><h2>판독 근거와 우선 간호</h2><p id="desc"></p><p><b>핵심 소견:</b> <span id="finding"></span></p><p><b>우선 간호:</b> <span id="action"></span></p></section><div class="foot">교육용 앱입니다. 실제 진단이나 환자 처치에 사용하지 마세요.</div></main><script>const data=[{c:'정상·동성리듬',l:'basic',t:'정상 동성리듬',h:72,q:'이 심전도의 가장 적절한 판독은?',o:['정상 동성리듬','심방세동','심실빈맥','완전 방실차단'],a:0,d:'규칙적인 R-R 간격과 각 QRS 앞의 P파를 확인합니다.',f:'P-QRS 1:1, 규칙적 R-R',n:'증상과 활력징후를 확인하고 관찰합니다.',w:'sinus'},{c:'허혈·ST-T 변화',l:'advanced',t:'심근허혈 의심',h:88,q:'흉통 환자에서 우선 주목할 변화는?',o:['ST 분절 하강','델타파','톱니모양 F파','방실 해리'],a:0,d:'협심증에서는 발작 중 수평형 또는 하향형 ST 하강이 나타날 수 있습니다.',f:'허혈성 ST 분절 하강',n:'흉통 사정, 12유도 ECG, 활력징후 확인 후 즉시 보고합니다.',w:'down'},{c:'심근경색',l:'advanced',t:'급성 ST 상승 의심',h:96,q:'연속된 유도의 ST 상승은 무엇을 시사합니까?',o:['급성 심근손상 가능성','정상 변이','심방조동','1도 방실차단'],a:0,d:'증상과 함께 연속된 유도의 ST 상승은 급성 심근경색을 의심하게 합니다.',f:'연속 유도의 ST 상승',n:'응급 대응체계를 활성화하고 초기 처치를 준비합니다.',w:'up'},{c:'심방성 부정맥',l:'basic',t:'심방세동',h:132,q:'불규칙한 R-R과 P파 부재를 보이는 리듬은?',o:['심방세동','동성빈맥','심실세동','Mobitz I'],a:0,d:'심방세동은 뚜렷한 P파가 없고 심실 반응이 불규칙합니다.',f:'P파 부재, 불규칙-불규칙',n:'혈역학적 안정성과 맥박 결손을 확인합니다.',w:'af'},{c:'심방성 부정맥',l:'advanced',t:'심방조동',h:150,q:'반복적인 톱니모양 파형은?',o:['심방조동','심실세동','정상 동성리듬','동성정지'],a:0,d:'심방조동은 규칙적인 F파가 톱니모양으로 반복됩니다.',f:'톱니모양 F파',n:'심실 반응과 혈역학적 안정성을 확인합니다.',w:'flutter'},{c:'심실성 부정맥',l:'advanced',t:'심실빈맥',h:182,q:'저혈압이 동반된 넓은 QRS 빈맥에서 우선 확인할 것은?',o:['맥박과 혈역학적 안정성','P파만 확인','정상 리듬 기록','운동 권장'],a:0,d:'심실빈맥은 넓고 규칙적인 QRS 빈맥으로 보일 수 있습니다.',f:'규칙적인 넓은 QRS 빈맥',n:'맥박 확인, 응급 호출, 심율동전환을 준비합니다.',w:'vt'},{c:'심실성 부정맥',l:'advanced',t:'심실세동',h:0,q:'맥박이 없고 조직화된 QRS가 없는 경우 우선 처치는?',o:['즉시 CPR과 제세동','보행 격려','24시간 후 재검','경구 수분'],a:0,d:'심실세동은 효과적인 심박출이 없는 치명적 리듬입니다.',f:'무질서한 파형, QRS 없음',n:'즉시 CPR과 제세동을 시행합니다.',w:'vf'},{c:'전도장애',l:'advanced',t:'완전 방실차단',h:38,q:'P파와 QRS가 서로 독립적으로 나타나는 소견은?',o:['3도 방실차단','정상 동성리듬','심방세동','PVC'],a:0,d:'심방과 심실이 독립적으로 탈분극하여 방실 해리가 나타납니다.',f:'방실 해리',n:'저관류 증상을 확인하고 경피적 심박동을 준비합니다.',w:'block'}];const $=s=>document.querySelector(s);let cur=null,stats=JSON.parse(localStorage.getItem('ecg-docs')||'{"c":0,"t":0}');[...new Set(data.map(x=>x.c))].forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`));function path(type){let p=[],a=(x,y)=>p.push(`${x},${y}`),b=160;if(type==='vf'){for(let x=0;x<=1000;x+=7)a(x,b+Math.sin(x*.17)*55+Math.sin(x*.53)*25);return'M'+p.join(' L')}let beats=type==='vt'?9:type==='block'?3:type==='af'?7:5,g=1000/beats;for(let i=0;i<beats;i++){let s=i*g,j=type==='af'?(i%2?24:-13):0;if(type==='flutter')for(let k=0;k<5;k++){a(s+k*g/5,b);a(s+k*g/5+g/10,b-18);a(s+k*g/5+g/5,b)}if(type==='af')for(let k=0;k<8;k++)a(s+k*g/8,b+Math.sin((s+k)*.7)*8);if(type==='block'){a(s,b);a(s+18,b-16);a(s+35,b);a(s+g*.45,b);a(s+g*.49,b-48);a(s+g*.54,b+62);a(s+g*.59,b-28);a(s+g*.66,b)}else if(type==='vt'){a(s,b);a(s+g*.15,b-85);a(s+g*.38,b+75);a(s+g*.72,b-35);a(s+g,b)}else{a(s,b);if(!['af','flutter'].includes(type)){a(s+g*.12,b-15);a(s+g*.22,b)}a(s+g*.36+j,b);a(s+g*.4+j,b-70);a(s+g*.45+j,b+85);a(s+g*.5+j,b-25);let st=type==='down'?b+28:type==='up'?b-30:b;a(s+g*.58+j,st);a(s+g*.72+j,st);a(s+g*.82+j,b-22);a(s+g*.94+j,b)}}return'M'+p.join(' L')}function pct(){$('#pct').textContent=stats.t?Math.round(stats.c/stats.t*100)+'%':'0%'}function next(){let pool=data.filter(x=>($('#cat').value==='전체'||x.c===$('#cat').value)&&($('#level').value==='all'||x.l===$('#level').value));cur=pool[Math.floor(Math.random()*pool.length)];$('#tag').textContent=cur.c;$('#title').textContent=cur.t;$('#hr').textContent=cur.h||'—';$('#q').textContent=cur.q;$('#wave').setAttribute('d',path(cur.w));$('#fb').textContent='';$('#exp').classList.remove('show');$('#opts').innerHTML='';cur.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>ans(i,b);$('#opts').appendChild(b)})}function ans(i,b){document.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n===cur.a)x.classList.add('correct')});if(i!==cur.a)b.classList.add('wrong');stats.t++;if(i===cur.a)stats.c++;localStorage.setItem('ecg-docs',JSON.stringify(stats));pct();$('#fb').textContent=i===cur.a?'정답입니다.':'오답입니다. 정답과 근거를 확인하세요.';$('#desc').textContent=cur.d;$('#finding').textContent=cur.f;$('#action').textContent=cur.n;$('#exp').classList.add('show')}$('#next').onclick=next;$('#cat').onchange=next;$('#level').onchange=next;pct();next();</script></body></html>
