<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>ECG Rhythm Lab</title><style>:root{--bg:#050b14;--panel:#102033;--line:#263c55;--text:#f5f8ff;--muted:#9fb0c4;--mint:#4be0cf;--red:#ff748d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16304c,#050b14 45%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:22px 0 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.35rem;font-weight:900}.brand small{display:block;color:var(--muted);font-size:.68rem;margin-top:4px}.card{background:linear-gradient(145deg,rgba(18,36,58,.96),rgba(8,18,31,.96));border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px rgba(0,0,0,.25)}.hero{margin-top:18px;padding:30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:8px 0}.hero em{font-style:normal;color:var(--mint)}.hero p{color:var(--muted);line-height:1.7}.score{min-width:120px;text-align:center;padding:20px;border-radius:18px;background:#081524}.score strong{font-size:2rem;color:var(--mint)}.controls{margin-top:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px}select,button{font:inherit;border-radius:12px;padding:12px}select{background:#081524;color:var(--text);border:1px solid var(--line)}button{border:0;background:var(--mint);font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:14px;margin-top:14px}.monitor,.quiz,.explain{padding:18px}.head{display:flex;justify-content:space-between;align-items:start}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(75,224,207,.1);color:var(--mint);font-size:.72rem;font-weight:800}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.75rem;margin-top:10px}.hr{color:var(--mint);font-size:2rem;font-weight:900}.screen{margin-top:14px;background:#04120f;border-radius:15px;overflow:hidden;border:1px solid rgba(75,224,207,.18)}svg{display:block;width:100%;min-height:220px}.small{stroke:#0d342f}.large{stroke:#155b50}.wave{fill:none;stroke:#68f3d8;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(104,243,216,.45))}.question{font-size:1.25rem;line-height:1.45}.opts{display:grid;gap:9px}.opt{background:#081524;color:var(--text);border:1px solid var(--line);text-align:left}.opt.correct{border-color:var(--mint);background:rgba(75,224,207,.1)}.opt.wrong{border-color:var(--red);background:rgba(255,116,141,.1)}.feedback{margin-top:12px;color:var(--muted)}.explain{margin-top:14px;display:none}.explain.show{display:block}.explain p{color:var(--muted);line-height:1.7}.foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:20px}@media(max-width:760px){.hero{display:grid}.score{width:100%}.controls,.grid{grid-template-columns:1fr}svg{min-height:170px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">ECG Rhythm Lab<small>PTB-XL Learning Studio</small></div><div class="tag">파형 엔진 v2</div></div><section class="hero card"><div><span class="tag">NURSING · ECG</span><h1>파형을 읽고,<br><em>임상 판단</em>까지</h1><p>협심증의 ST 변화부터 심방세동, 심실빈맥, 완전 방실차단까지 PC와 휴대폰에서 학습합니다.</p></div><div class="score"><strong id="pct">0%</strong><div>정답률</div></div></section><section class="controls card"><select id="cat"><option>전체</option></select><select id="level"><option value="all">전체 난이도</option><option value="basic">기초</option><option value="advanced">심화</option></select><button id="next">새 문제</button></section><section class="grid"><article class="monitor card"><div class="head"><div><span id="tag" class="tag">리듬</span><h2 id="title">문제 준비 중</h2><div class="meta"><span id="regularity"></span><span>Lead II</span><span>25 mm/s</span></div></div><div><span class="hr" id="hr">--</span> bpm</div></div><div class="screen"><svg viewBox="0 0 1000 320"><defs><pattern id="s" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" class="small" fill="none"/></pattern><pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#s)"/><path d="M50 0H0V50" class="large" fill="none"/></pattern></defs><rect width="1000" height="320" fill="url(#g)"/><path id="wave" class="wave"/></svg></div></article><aside class="quiz card"><div class="tag">QUESTION</div><h2 id="q" class="question"></h2><div id="opts" class="opts"></div><div id="fb" class="feedback"></div></aside></section><section id="exp" class="explain card"><h2>판독 근거와 우선 간호</h2><p id="desc"></p><p><b>핵심 소견:</b> <span id="finding"></span></p><p><b>우선 간호:</b> <span id="action"></span></p></section><div class="foot">교육용 합성 파형입니다. 실제 진단이나 환자 처치에 사용하지 마세요.</div></main><script>const data=[{c:'정상·동성리듬',l:'basic',t:'정상 동성리듬',h:72,r:'규칙적',q:'이 심전도의 가장 적절한 판독은?',o:['정상 동성리듬','심방세동','심실빈맥','완전 방실차단'],a:0,d:'규칙적인 R-R 간격과 각 QRS 앞의 P파를 확인합니다.',f:'P-QRS 1:1, 규칙적 R-R',n:'증상과 활력징후를 확인하고 관찰합니다.',w:'sinus'},{c:'허혈·ST-T 변화',l:'advanced',t:'심근허혈 의심',h:88,r:'규칙적',q:'흉통 환자에서 우선 주목할 변화는?',o:['ST 분절 하강','델타파','톱니모양 F파','방실 해리'],a:0,d:'협심증에서는 발작 중 수평형 또는 하향형 ST 하강이 나타날 수 있습니다.',f:'허혈성 ST 분절 하강',n:'흉통 사정, 12유도 ECG, 활력징후 확인 후 즉시 보고합니다.',w:'down'},{c:'심근경색',l:'advanced',t:'급성 ST 상승 의심',h:96,r:'규칙적',q:'연속된 유도의 ST 상승은 무엇을 시사합니까?',o:['급성 심근손상 가능성','정상 변이','심방조동','1도 방실차단'],a:0,d:'증상과 함께 연속된 유도의 ST 상승은 급성 심근경색을 의심하게 합니다.',f:'연속 유도의 ST 상승',n:'응급 대응체계를 활성화하고 초기 처치를 준비합니다.',w:'up'},{c:'심방성 부정맥',l:'basic',t:'심방세동',h:132,r:'불규칙-불규칙',q:'불규칙한 R-R과 P파 부재를 보이는 리듬은?',o:['심방세동','동성빈맥','심실세동','Mobitz I'],a:0,d:'심방세동은 뚜렷한 P파가 없고 심실 반응이 불규칙합니다.',f:'P파 부재, 불규칙-불규칙',n:'혈역학적 안정성과 맥박 결손을 확인합니다.',w:'af'},{c:'심방성 부정맥',l:'advanced',t:'심방조동',h:150,r:'대체로 규칙적',q:'반복적인 톱니모양 파형은?',o:['심방조동','심실세동','정상 동성리듬','동성정지'],a:0,d:'심방조동은 규칙적인 F파가 톱니모양으로 반복됩니다.',f:'톱니모양 F파',n:'심실 반응과 혈역학적 안정성을 확인합니다.',w:'flutter'},{c:'심실성 부정맥',l:'advanced',t:'심실빈맥',h:182,r:'규칙적',q:'저혈압이 동반된 넓은 QRS 빈맥에서 우선 확인할 것은?',o:['맥박과 혈역학적 안정성','P파만 확인','정상 리듬 기록','운동 권장'],a:0,d:'심실빈맥은 넓고 규칙적인 QRS 빈맥으로 보일 수 있습니다.',f:'규칙적인 넓은 QRS 빈맥',n:'맥박 확인, 응급 호출, 심율동전환을 준비합니다.',w:'vt'},{c:'심실성 부정맥',l:'advanced',t:'심실세동',h:0,r:'무질서',q:'맥박이 없고 조직화된 QRS가 없는 경우 우선 처치는?',o:['즉시 CPR과 제세동','보행 격려','24시간 후 재검','경구 수분'],a:0,d:'심실세동은 효과적인 심박출이 없는 치명적 리듬입니다.',f:'무질서한 파형, QRS 없음',n:'즉시 CPR과 제세동을 시행합니다.',w:'vf'},{c:'전도장애',l:'advanced',t:'완전 방실차단',h:38,r:'P-P와 R-R 각각 규칙적',q:'P파와 QRS가 서로 독립적으로 나타나는 소견은?',o:['3도 방실차단','정상 동성리듬','심방세동','PVC'],a:0,d:'심방과 심실이 독립적으로 탈분극하여 방실 해리가 나타납니다.',f:'방실 해리',n:'저관류 증상을 확인하고 경피적 심박동을 준비합니다.',w:'block'}];const $=s=>document.querySelector(s);let cur=null,stats=JSON.parse(localStorage.getItem('ecg-docs-v2')||'{"c":0,"t":0}');[...new Set(data.map(x=>x.c))].forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`));const P=[];function pt(x,y){P.push(`${x.toFixed(1)},${y.toFixed(1)}`)}function baseline(x){return 160+2.4*Math.sin(x*.045)+1.2*Math.sin(x*.12)}function qrs(center,wide=false,amp=1){const w=wide?62:34;pt(center-w*.55,baseline(center));pt(center-w*.28,160+5);pt(center-w*.12,160-24*amp);pt(center,160+82*amp);pt(center+w*.18,160-105*amp);pt(center+w*.36,160+18);pt(center+w*.58,baseline(center+w*.58))}function pWave(center){pt(center-34,160);pt(center-18,154);pt(center,148);pt(center+18,154);pt(center+34,160)}function tWave(center,offset=0){pt(center-42,160+offset);pt(center-18,151+offset);pt(center,139+offset);pt(center+20,151+offset);pt(center+45,160)}function normal(type){P.length=0;const centers=[120,300,480,660,840];for(const c of centers){pt(c-90,baseline(c-90));pWave(c-64);pt(c-30,160);qrs(c);let st=type==='down'?22:type==='up'?-24:0;pt(c+28,160+st);pt(c+70,160+st);tWave(c+112,st*.45);pt(c+150,baseline(c+150))}return'M'+P.join(' L')}function af(){P.length=0;for(let x=0;x<=1000;x+=5)pt(x,160+4*Math.sin(x*.19)+2.5*Math.sin(x*.47));const centers=[78,225,342,535,668,846,945];for(const c of centers)qrs(c,false,.9);P.sort((a,b)=>parseFloat(a)-parseFloat(b));return'M'+P.join(' L')}function flutter(){P.length=0;for(let x=0;x<=1000;x+=16){pt(x,160);pt(x+8,144);pt(x+16,160)}for(const c of [145,355,565,775,965])qrs(c,false,.92);P.sort((a,b)=>parseFloat(a)-parseFloat(b));return'M'+P.join(' L')}function vt(){P.length=0;for(const c of [70,175,280,385,490,595,700,805,910]){pt(c-48,160);qrs(c,true,1.08);pt(c+48,160)}return'M'+P.join(' L')}function vf(){P.length=0;for(let x=0;x<=1000;x+=4)pt(x,160+34*Math.sin(x*.09)+21*Math.sin(x*.21)+9*Math.sin(x*.47));return'M'+P.join(' L')}function block(){P.length=0;for(let x=30;x<1000;x+=120)pWave(x);for(const c of [170,430,690,950])qrs(c,true,.75);P.sort((a,b)=>parseFloat(a)-parseFloat(b));return'M'+P.join(' L')}function path(type){if(type==='af')return af();if(type==='flutter')return flutter();if(type==='vt')return vt();if(type==='vf')return vf();if(type==='block')return block();return normal(type)}function pct(){$('#pct').textContent=stats.t?Math.round(stats.c/stats.t*100)+'%':'0%'}function next(){let pool=data.filter(x=>($('#cat').value==='전체'||x.c===$('#cat').value)&&($('#level').value==='all'||x.l===$('#level').value));cur=pool[Math.floor(Math.random()*pool.length)];$('#tag').textContent=cur.c;$('#title').textContent=cur.t;$('#hr').textContent=cur.h||'—';$('#regularity').textContent='리듬 '+cur.r;$('#q').textContent=cur.q;$('#wave').setAttribute('d',path(cur.w));$('#fb').textContent='';$('#exp').classList.remove('show');$('#opts').innerHTML='';cur.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>ans(i,b);$('#opts').appendChild(b)})}function ans(i,b){document.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n===cur.a)x.classList.add('correct')});if(i!==cur.a)b.classList.add('wrong');stats.t++;if(i===cur.a)stats.c++;localStorage.setItem('ecg-docs-v2',JSON.stringify(stats));pct();$('#fb').textContent=i===cur.a?'정답입니다.':'오답입니다. 정답과 근거를 확인하세요.';$('#desc').textContent=cur.d;$('#finding').textContent=cur.f;$('#action').textContent=cur.n;$('#exp').classList.add('show')}$('#next').onclick=next;$('#cat').onchange=next;$('#level').onchange=next;pct();next();</script></body></html>
